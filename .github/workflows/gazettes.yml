# Nightly check for new IRD gazettes.
#
# The IRD publishes 3-6 gazettes a year, so this workflow does nothing on almost
# every run, and that is the design target: it must be cheap to do nothing, and
# it must leave no trace when there is nothing to say.
#
# State lives in the repository, not in the runner. The IRD listing is fetched
# live, `data/recovered.json` records every gazette recovered from outside it,
# and `data/summaries.json` holds the LLM output, so a cold runner rebuilds the
# whole corpus without re-summarising it. The database itself is
# gitignored and rebuilt each run; the PDFs are cached because they are bulky
# and re-fetchable, never because they are precious.
name: gazettes

on:
  schedule:
    - cron: "17 2 * * *"      # 02:17 UTC daily, off the hour to avoid the stampede
  workflow_dispatch:           # and on demand, for testing

permissions:
  contents: write              # to commit the listing, manifest, summaries and feeds

concurrency:
  group: gazettes
  cancel-in-progress: false    # never interrupt a run mid-fetch; it holds no lock

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poppler and tesseract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr

      - name: Install Python dependencies
        run: pip install -q -r requirements.txt

      # PDFs and extracted text only. Both are re-fetchable from the manifest,
      # so a cache miss costs time and politeness, never correctness or money.
      # Restore and save are split so the key can describe what is actually
      # cached. It used to hash data/manifest.csv, a Phase 0 file that nothing
      # has written since: the key never changed, an exact hit never re-saves,
      # and every PDF fetched after the first save was downloaded again every
      # night. Restoring by prefix takes the newest cache; saving under a hash
      # of the PDFs on disk makes a new cache exactly when a PDF was added.
      - name: Restore fetched PDFs
        uses: actions/cache/restore@v4
        with:
          path: |
            data/gazettes
            data/text
          key: gazettes-restore
          restore-keys: gazettes-

      - name: Build the corpus
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          python3 -m vidhana init
          python3 -m vidhana sync
          # The listing is not the whole corpus. Gazettes the IRD omits were
          # recovered from the Internet Archive and are recorded in
          # data/recovered.json; without this a cold runner cannot know they
          # exist, and on 2026-09-10 it dropped all seven. Fatal on failure.
          python3 -m vidhana restore
          python3 -m vidhana fetch
          # Load what we already paid for before asking for anything new, so
          # only genuinely new gazettes reach the model.
          python3 -m vidhana summaries import
          python3 -m vidhana structure
          python3 -m vidhana summaries export
          python3 -m vidhana resolve
          python3 -m vidhana reindex
          python3 -m vidhana feed
          python3 -m vidhana export-web

      # Before the guard, so a run that refuses to publish still keeps what it
      # downloaded. An unchanged set hashes to a key that already exists, which
      # the action reports and skips; that is not a failure.
      - name: Save fetched PDFs
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            data/gazettes
            data/text
          key: gazettes-${{ hashFiles('data/gazettes/*.pdf') }}

      - name: Report what changed
        run: python3 -m vidhana whatsnew --since "$(date -u -d '30 days ago' +%F)"

      # Compares what is about to be committed with what already is, and fails
      # if any gazette or summary would disappear. A failure here commits
      # nothing and, because pages.yml deploys only on success, publishes
      # nothing — a missed night loses nothing, since events are derived.
      - name: Refuse to publish a smaller corpus
        run: python3 -m vidhana guard

      # Only the derived artefacts that are meant to be tracked. The database,
      # the PDFs and the extracted text are all gitignored and stay that way.
      # docs/data carries the search index the front end loads, so a new
      # gazette reaches readers on the same run that finds it.
      - name: Commit any changes
        run: |
          set -euo pipefail
          git config user.name  "vidhana-bot"
          git config user.email "noreply@github.com"
          git add data/listing data/manifest.csv data/summaries.json docs/feeds docs/data
          if git diff --cached --quiet; then
            echo "no change — nothing published today"
            exit 0
          fi
          # The subject names what actually moved, so the history stays a record
          # of the law changing rather than of this workflow running.
          n=$(python3 -m vidhana whatsnew --since "$(date -u -d '30 days ago' +%F)" \
                --kind published --limit 99 | grep -c 'new gazette' || true)
          git commit -m "chore(data): nightly gazette check, ${n} new in the last 30 days"
          git push
